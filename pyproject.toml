[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "launchsignal"
version = "1.0.0"
description = "Stateful public-source YC and a16z Speedrun launch monitor for Slack"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Aditya Sarade" }]
keywords = ["yc", "ycombinator", "speedrun", "slack", "monitoring", "gtm"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Topic :: Office/Business",
]
# No third-party dependencies. The standard library covers HTTP, SQLite, the
# .env reader and the Pond control plane, which keeps setup to one command.
dependencies = []

[project.urls]
Homepage = "https://github.com/adityasarade/launchsignal"
Issues = "https://github.com/adityasarade/launchsignal/issues"

[project.scripts]
launchsignal = "launchsignal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# BLE, N and S are enabled deliberately: the code suppresses specific instances
# of each (a failing source must never kill the run; urlopen targets are source
# constants; stdlib handler overrides keep their own naming). Enabling them is
# what makes those `noqa` markers meaningful instead of dead comments.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "BLE", "N", "S"]
ignore = [
  "E501",                        # long lines are the formatter's business
  "RUF001", "RUF002", "RUF003",  # typographic punctuation in the regexes is deliberate
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, bind throwaway names, and monkeypatch module attributes by
# design; and their fixture strings are not real credentials.
"tests/*" = [
  "S101", "S105", "S106", "S311", "S310", "N802",
  "RUF059", "RUF005", "BLE001", "E402",
]
